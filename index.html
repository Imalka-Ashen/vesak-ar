<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Vesak Lantern</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.3.2/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true;"
  arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- Camera -->
  <a-entity camera></a-entity>

  <!-- Marker -->
  <a-marker preset="hiro">

    <!-- TEST OBJECT (keep this first) -->
    <a-box 
      position="0 0.5 0" 
      material="color: red;">
    </a-box>

    <!-- YOUR LANTERN MODEL (uncomment AFTER test works) -->
    <!--
    <a-entity 
      gltf-model="Lantern.glb"
      scale="0.5 0.5 0.5"
      position="0 0 0"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
    </a-entity>
    -->

  </a-marker>

</a-scene>

</body>
</html>
